<app-header title="Mi Inventario"></app-header>

<ion-content>
  <app-logo></app-logo>
  <div class="contenido">
    <div class="titulo">
      <h1 class="d-flex-center">Mi Inventario</h1>
    </div>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <div class="scanner">
          <ion-icon name="scan-outline" size="large" (click)="scanAndSearchInMyFoods()"></ion-icon>
          <p>Escanea para agregar tus productos al inventario!</p>
        </div>
    
        <div class="video-container" *ngIf="showScanner">
          <div class="barcode-line vertical"></div>
          <div class="barcode-line horizontal"></div>
          <video #videoElement id="video" playsinline autoplay style="width: 100%; height: auto; transform: scaleX(-1);"></video>
          <canvas #canvasElement style="display: none;"></canvas>
        </div>
      </ion-col>
    </ion-row>
    
    <ion-row>
      <ion-col size="12">
        <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="filterFoods($event)"></ion-searchbar>
      </ion-col>
    </ion-row>
  
    <ion-row>
      <ion-col size="12">
        <ion-button class="filtrar" expand="block" (click)="openFilterModal()">Filtrar</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid>
    <ion-row style="display: flex; justify-content: center; align-items: center; flex-wrap: wrap;">
      <ng-container *ngFor="let food of filteredFoods">
        <ion-col size="3" style="margin: 0 -1px;">
          <ion-card class="food-card" [ngStyle]="{'border-color': food.bgColor, 'border-width': '5px', 'border-style': 'solid'}">
              <div class="image-container">
                  <ion-img [src]="food.imagen" alt="Imagen del alimento" class="food-image"></ion-img>
                  
                  <!-- Botón para abrir el modal de modificar stock, asegúrate de que está encima y accesible -->
                  <ion-button fill="clear" class="edit-button" *ngIf="!food.showStockEditor" (click)="openEditStockModal(food)">
                      <ion-icon name="create-outline"></ion-icon>
                  </ion-button>
      
                  <!-- Botón para establecer stock ideal, asegúrate de que no bloquea el botón de modificar -->
                  <ion-button class="stock-id" *ngIf="!food.showStockEditor" (click)="openEditIdealStockModal(food)" fill="clear">
                      <ion-icon name="settings-outline" style="opacity: 0;"></ion-icon>
                  </ion-button>
      
                  <div class="stock-label">
                      <h5>{{ food.stock }}</h5>
                  </div>
              </div>
              <ion-card-content class="food-card-content">
                  <p style="font-size: 10px; color: #44B0F1; font-weight: bold;">{{ food.name }}</p>
              </ion-card-content>
          </ion-card>
      </ion-col>
